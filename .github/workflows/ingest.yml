name: Log stock report
# A "Stock report" issue becomes lines in data/reports.json, then the issue is closed with a reply.
# Reports from the owner and collaborators go straight in; anyone else's wait for the "approved" label.
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  actions: write # to start the Deploy site workflow

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: log
        env:
          NUM: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another report or the stock check may push first: start over from the latest commit and retry.
          for try in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME" && git reset -q --hard FETCH_HEAD
            result=$(python3 scripts/restock.py ingest "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/reply.md")
            [ "$result" = logged ] || break
            git commit -qam "Stock report #$NUM" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break
            result=unpushed
            sleep $((try * 5))
          done
          echo "result=$result" >> "$GITHUB_OUTPUT"
          [ "$result" != unpushed ]
      - if: steps.log.outputs.result == 'logged' || steps.log.outputs.result == 'invalid'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          RESULT: ${{ steps.log.outputs.result }}
        run: |
          reason="not planned"
          if [ "$RESULT" = logged ]; then
            gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
            reason=completed
          fi
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/reply.md"
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --reason "$reason"
